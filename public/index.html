<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>mobi — Training & Beweglichkeit</title>
  <meta name="description" content="Krafttraining mit Plan, tägliche Mobility-Routinen und über 130 animierte Übungen.">
  <meta name="theme-color" content="#FAF6EF">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="mobi">
  <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Thema vor dem ersten Zeichnen setzen (kein Aufblitzen).
    (function () {
      var t = 'auto';
      try { t = (JSON.parse(localStorage.getItem('mobi.settings') || '{}').theme) || 'auto'; } catch (e) {}
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dunkel' : 'hell';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <main id="main">
      <section id="view-heute" class="view"></section>
      <section id="view-training" class="view hidden"></section>
      <section id="view-uebungen" class="view hidden"></section>
      <section id="view-verlauf" class="view hidden"></section>
      <section id="view-profil" class="view hidden"></section>
    </main>
    <button id="resume" class="hidden"></button>
    <nav id="tabbar" aria-label="Hauptnavigation"></nav>
  </div>
  <div id="player" class="overlay hidden"></div>
  <div id="workout" class="overlay hidden"></div>
  <div id="rest" class="hidden"></div>
  <div id="sheet-backdrop" class="hidden"><div id="sheet" role="dialog"></div></div>
  <noscript>mobi braucht JavaScript.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
